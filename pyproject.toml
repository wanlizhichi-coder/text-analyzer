[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-analyzer"
version = "0.1.0"
description = "A small text analysis project for learning Python engineering."
requires-python = ">=3.10"
dependencies = [
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]